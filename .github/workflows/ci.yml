name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      esphome_version:
        description: "ESPHome Version (leer = latest)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * 1"   # Jeden Montag 03:00 UTC – prüft ob neue ESPHome-Version noch kompatibel ist

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------
  # Job 1: YAML validieren (schnell, kein Kompilieren)
  # -------------------------------------------------------
  validate:
    name: "✅ Validate YAML"
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install ESPHome
        run: |
          if [ -n "${{ github.event.inputs.esphome_version }}" ]; then
            pip install esphome==${{ github.event.inputs.esphome_version }}
          else
            pip install esphome
          fi

      - name: 🔍 ESPHome Version
        run: esphome version

      - name: 📝 Create secrets.yaml (CI dummy)
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "CI_SSID"
          wifi_password: "CI_PASSWORD"
          encryption_key: "CI_KEY_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "CI_OTA_PASSWORD"
          fallback_pw: "CI_FALLBACK_PW"
          EOF

      - name: ✅ Validate configuration
        run: esphome config embinotec-weatherstation.yaml

  # -------------------------------------------------------
  # Job 2: Kompilieren (dauert länger, braucht Job 1)
  # -------------------------------------------------------
  compile:
    name: "🔨 Compile Firmware"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Install ESPHome
        run: |
          if [ -n "${{ github.event.inputs.esphome_version }}" ]; then
            pip install esphome==${{ github.event.inputs.esphome_version }}
          else
            pip install esphome
          fi

      - name: 💾 Cache ESPHome build
        uses: actions/cache@v4
        with:
          path: |
            .esphome
            ~/.platformio
          key: esphome-${{ runner.os }}-${{ hashFiles('embinotec-weatherstation.yaml') }}
          restore-keys: |
            esphome-${{ runner.os }}-

      - name: 📝 Create secrets.yaml (CI dummy)
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "CI_SSID"
          wifi_password: "CI_PASSWORD"
          encryption_key: "CI_KEY_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password: "CI_OTA_PASSWORD"
          fallback_pw: "CI_FALLBACK_PW"
          EOF

      - name: 🔨 Compile firmware
        run: esphome compile embinotec-weatherstation.yaml

      - name: 📦 Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: .esphome/build/embinotec-weatherstation/.pioenvs/*/firmware.bin
          retention-days: 30

  # -------------------------------------------------------
  # Job 3: Made for ESPHome Anforderungen prüfen
  # -------------------------------------------------------
  made-for-esphome:
    name: "🏷️ Made for ESPHome Checklist"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔍 Check required fields
        run: |
          echo "Checking Made for ESPHome requirements..."
          YAML="embinotec-weatherstation.yaml"
          ERRORS=0

          check() {
            if grep -q "$1" "$YAML"; then
              echo "  ✅ $2"
            else
              echo "  ❌ MISSING: $2"
              ERRORS=$((ERRORS + 1))
            fi
          }

          check "project:"              "esphome.project defined"
          check "name_add_mac_suffix:"  "name_add_mac_suffix present"
          check "dashboard_import:"     "dashboard_import present"
          check "esp32_improv:"         "esp32_improv (BLE provisioning)"
          check "improv_serial:"        "improv_serial (USB provisioning)"
          check "platform: esphome"     "OTA platform: esphome"
          check "api:"                  "api component"
          check "logger:"               "logger component"

          if ! grep -q "!secret" "$YAML"; then
            echo "  ✅ No hardcoded secrets in YAML"
          else
            echo "  ⚠️  YAML references secrets – ensure secrets.yaml is in .gitignore"
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ $ERRORS Made for ESPHome requirement(s) missing!"
            exit 1
          else
            echo ""
            echo "✅ All Made for ESPHome requirements met!"
          fi