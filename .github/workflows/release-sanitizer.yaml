name: Sanitize

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "sanitized/**"
  release:
    types: [published]

permissions:
  contents: write

env:
  MAIN_YAML: esphome/embinotec-weatherstation.yaml     ## Hauptprojekt-Datei (anpassen)
  EXAMPLES_DIR: examples

jobs:
  # ---------------------------------------------------------------
  # Bei jedem Push: bereinigen, prüfen, validieren, auf dem
  # Hauptzweig sanitized/ committen
  # ---------------------------------------------------------------
  sanitize:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: sanitize-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bereinigte Dateien erzeugen
        run: |
          rm -rf sanitized
          python3 .github/scripts/sanitize.py . sanitized

      - name: Prüfen, dass nichts Sensibles übrig ist
        run: |
          if grep -rnE '!secret|^\s*(password|psk|passphrase)\s*:' sanitized \
               --include='*.yaml' --include='*.yml'; then
            echo "Es sind noch Secrets oder Passwörter enthalten."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bereinigte Konfiguration mit ESPHome validieren
        run: |
          pip install esphome
          esphome version
          esphome config "sanitized/${MAIN_YAML}"

      - name: sanitized/ committen (nur Hauptzweig)
        if: github.ref_name == github.event.repository.default_branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sanitized
          if git diff --cached --quiet; then
            echo "sanitized/ ist bereits aktuell."
          else
            git commit -m "chore: sanitized-Dateien aktualisieren [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:${BRANCH}"
          fi

  # ---------------------------------------------------------------
  # Bei einem Release: ZIP frisch aus dem Tag erzeugen und anhängen
  # ---------------------------------------------------------------
  release-zip:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Bereinigte Dateien erzeugen
        run: python3 .github/scripts/sanitize.py . "$RUNNER_TEMP/sanitized"

      - name: Prüfen, dass nichts Sensibles übrig ist
        run: |
          if grep -rnE '!secret|^\s*(password|psk|passphrase)\s*:' "$RUNNER_TEMP/sanitized" \
               --include='*.yaml' --include='*.yml'; then
            echo "Es sind noch Secrets oder Passwörter enthalten."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bereinigte Konfiguration mit ESPHome validieren
        run: |
          pip install esphome
          esphome config "$RUNNER_TEMP/sanitized/${MAIN_YAML}"

      - name: ZIP erstellen und ans Release hängen
        run: |
          ZIP="$GITHUB_WORKSPACE/embinotec-esphome-weatherstation-${TAG}.zip"
          (cd "$RUNNER_TEMP/sanitized" && zip -r "$ZIP" .)
          gh release upload "$TAG" "$ZIP" --clobber