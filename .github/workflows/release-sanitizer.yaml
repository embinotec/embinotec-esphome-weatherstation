name: Release (bereinigte Dateien)

on:
  release:
    types: [published]

permissions:
  contents: write

# Mit release-changelog.yml teilen, damit sich die Pushes nicht überholen
concurrency:
  group: release-push
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      MAIN_YAML: esphome/tododisplay.yaml     # Hauptprojekt-Datei (anpassen)
      EXAMPLES_DIR: examples
    steps:
      - name: Stand des Release-Tags auschecken
        uses: actions/checkout@v4
        with:
          path: src

      - name: Hauptzweig auschecken (Ziel von sanitized/)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          fetch-depth: 0

      - name: Bereinigte Dateien erzeugen
        run: |
          rm -rf repo/sanitized
          python3 src/.github/scripts/sanitize.py src repo/sanitized
          printf '%s\n' "# sanitized" "" \
            "Automatisch erzeugt beim Release (${TAG}). Nicht von Hand bearbeiten." \
            "Enthält keine WLAN-Zugangsdaten, Passwörter oder Verweise auf Secrets." \
            > repo/sanitized/README.md

      - name: Prüfen, dass nichts Sensibles übrig ist
        run: |
          if grep -rnE '!secret|^\s*(password|psk|passphrase)\s*:' repo/sanitized \
               --include='*.yaml' --include='*.yml'; then
            echo "Es sind noch Secrets oder Passwörter enthalten."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bereinigte Konfiguration mit ESPHome validieren
        working-directory: repo
        run: |
          pip install esphome
          esphome version
          esphome config "sanitized/${MAIN_YAML}"

      - name: sanitized/ auf den Hauptzweig committen
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sanitized
          if git diff --cached --quiet; then
            echo "sanitized/ ist bereits aktuell."
          else
            git commit -m "chore: sanitized-Dateien für ${TAG} [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: ZIP erstellen und ans Release hängen
        run: |
          ZIP="$GITHUB_WORKSPACE/embinotec-esphome-weatherstation-${TAG}.zip"
          (cd repo/sanitized && zip -r "$ZIP" .)
          gh release upload "$TAG" "$ZIP" --clobber