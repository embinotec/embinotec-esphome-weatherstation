# Einziger Workflow, der GitHub Pages deployt: Webseite UND Firmware.
name: Deploy Pages

on:
  push:
    branches: ["master"]
    paths:
      - "pages/**"
      - "assets/images/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:
  workflow_call:   # Aufruf aus ci.yml nach einem Release

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Bilder zur Seite kopieren
        run: |
          mkdir -p pages/assets/images
          cp assets/images/* pages/assets/images/

      - name: index.md mit Jekyll bauen
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site

      - name: Firmware des "latest"-Releases ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sudo chown -R "$USER" _site
          FILES="firmware.ota.bin firmware.ota.bin.md5 firmware.factory.bin firmware.factory.bin.md5 manifest.json"
          ARGS=()
          for f in $FILES; do ARGS+=(--pattern "$f"); done

          mkdir -p fw
          gh release download --repo "$GITHUB_REPOSITORY" --dir fw "${ARGS[@]}" || true

          COMPLETE=true
          for f in $FILES; do [ -s "fw/$f" ] || COMPLETE=false; done

          if [ "$COMPLETE" = true ]; then
            mkdir -p _site/firmware
            cp fw/* _site/firmware/
          else
            # Eine bereits veröffentlichte Firmware nie durch "nichts" ersetzen
            STATUS=$(curl -sSL -o /dev/null -w '%{http_code}' "$BASE_URL/firmware/manifest.json")
            if [ "$STATUS" != "404" ]; then
              echo "::error::Firmware im latest-Release unvollständig (HTTP $STATUS für die bisherige). Kein Deployment."
              exit 1
            fi
            echo "::warning::Noch keine Firmware vorhanden, nur die Webseite wird veröffentlicht."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
