name: Release (Changelog)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: towncrier installieren
        run: pip install towncrier

      - name: Show changelog draft
        run: |
          VERSION="${TAG#v}"
          towncrier build --draft --version "$VERSION" \
            --config towncrier.toml > release-notes.md

      - name: Release-Notes ins GitHub-Release schreiben
        run: | 
          gh release edit "$TAG" --notes-file release-notes.md
          rm release-notes.md

      - name: CHANGELOG create and delete fragments
        run: |
          VERSION="${TAG#v}"
          towncrier build --yes --version "$VERSION" \
            -- date $(date --rfc-3339=date) --config towncrier.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit."
          else
            git commit -m "Created changelog of ${TAG}"
            git push
          fi