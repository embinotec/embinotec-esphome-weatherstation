## embinotec develops smart home devices to fit the "made for esphome"
## this weatherstation could be purchased at https://www.embinotec.de/shop
## this yaml file is designed for hardware rev1.4


## How to use this configuration file:
##  1. Headlines and further information are commented with double hashes
##     to distiquiesh them from commented code.
##  2. To use or not use functions comment or uncomment the specivic sections.

##
##                  ESP32-C6-WROOM-1 PINOUT
##                  +-------[____]-------+
##             3v3  | 1               32 | GND
##    RST-BTN  RST  | 2               31 | TXD
## Battery-V   IO4  | 3               30 | RXD
## Solar-V     IO5  | 4               29 | IO15
##  LP_I2C.SDA IO6  | 5               28 | IO23 en.battery-v
##  LP_I2C.SCL IO7  | 6               27 | IO22 en.solar-v
## Status LED  IO0  | 7               26 | IO21 Int.UV
## CHRG stat   IO1  | 8               25 | IO20 
## Solar stat  IO8  | 9               24 | IO19
## Rain-gauge IO10  | 10              23 | IO18
## Wind-speed IO11  | 11              22 | IO9  BOOT/USER-BTN
## Wind-DirR   IO2  | 12              21 | GND
## Wind-DirL   IO3  | 13              20 | IO13  USB-D+
##            VDD5  | 14              19 | IO12  USB-D-
##             GND  | 15              18 | GND
##              NC  | 16              17 | NC
##                  +--------------------+

## ------ SUBSTITUTIONS -------
substitutions:
  devicename: "embinotec-weatherstation"
  friendly_devicename: "Embinotec WeatherStation"
  device_description: "WeatherStation with 8 sensors."


## ------ ESPHome HEADER -------
esphome:
  name: ${devicename}
  friendly_name: ${friendly_devicename}
  min_version: 2026.8.0
  name_add_mac_suffix: false
  comment: ${device_description}
  on_boot:
    priority: 600.0  # Run after components are initialized
    then:
      - component.update: update_components
 

## ------ ESP32 configuration ------
## Please be aware of changing one of these configuration options could cause in uncompilable code.

esp32:
  #variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: n
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y    ## Needed with 2026.8.0 and esp_improv
      CONFIG_OPENTHREAD_ENABLED: n
      CONFIG_ENABLE_WIFI_STATION: y
      CONFIG_USE_MINIMAL_MDNS: y


## ------ PACKAGES -------
#packages:


## ------ GLOBALS --------
globals:
  - id: pulse_count
    type: int
    restore_value: no
    initial_value: '0'
  ## --- barometric pressure variables ---
  - id: pressure_1h_ago
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: pressure_buffer_full
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: battery_present_state
    type: bool
    restore_value: false
    initial_value: 'false'

## ------ EXTERNAL COMPONENTS -------
external_components:
#  - source:
      #type: local
      #path: components
#      type: git
#      url: https://github.com/embinotec/esphome-ec
#      ref: main
#    refresh: always
