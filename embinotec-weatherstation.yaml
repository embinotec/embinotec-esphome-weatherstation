## ------ I2C SETTINGS ----------
## DO NOT CHANGE !!!
## I2C is an IC to IC connection to read for instance digital values from sensors.
i2c:
  - id: bus_a
    sda: GPIO6
    scl:
      number: GPIO7
    frequency: 100kHz

## ------- POWER MANGEMENT -------
## ESP32 should be powered by three times 2800mAh rechargable AA batteries.
## To save some power the ESP should not always be connected to your wifi and have some rest
## to cover the hole day with measurements.
deep_sleep:
  id: during_day
  run_duration: 3min
  sleep_duration: 5min

  #- id: during_night
  #  run_duration: 5min
  #  sleep_duration: 30min
  

## Example configuration with single pin wakeup on BK72xx
#deep_sleep:
#  wakeup_pin:  GPIO1 # CHARGE PIN will wakeup when P1 is high
#  wakeup_pin_mode: IGNORE # state of P8 at the moment of going to sleep does not influence the wakeup scenario

## Example configuration with multi-pin wakeup on BK72xx
#deep_sleep:
#  wakeup_pin:
#    - pin:
#        number: P8
#        inverted: True  # will wake up when P8 is low
#      wakeup_pin_mode: KEEP_AWAKE # will prevent sleep as long as P8 is low
#    - pin: P24 # will wake up when P24 goes high
#      wakeup_pin_mode: INVERT_WAKEUP # flips the trigger level after each wake

## ------ STATUS LED --------
## The red status LED at the bottom side of the weather station shows the status of the system by pattern:
## OFF: everything is ok
## slow blink: Warning: Not connected, trying to connect.
## fast blink: Error
status_led:
  pin: 
    number: GPIO0 ## esp32c6 
    inverted: false


## ------ Interval: Vor jeder Messung die Teiler aktivieren ------
interval:
  - interval: 30s
    id: update_components
    then:
      ## solar
      - switch.turn_on: divider_solar_enable
      - delay: 1200ms   ## 1uF stabilizing time
      - component.update: solar_voltage_raw
      ## battery
      - switch.turn_on: divider_battery_enable
      - delay: 1200ms    ## 1uF stabilizing time
      - component.update: battery_voltage_raw
      - delay: 2100ms                          # ← delayed_on/off abwarten
      - lambda: |-
          float v = id(battery_voltage_raw).state;
          bool charging = id(charge_detection).state;

          bool present;
          if (charging) {
            // Wenn Laden aktiv → Akku definitiv vorhanden
            // battery_present_state NICHT zurücksetzen
            present = true;
          } else {
            // Normaler Fall: Spannung auswerten
            present = !isnan(v) && v > 0.1f;
          }

          id(battery_present_state) = present;
          id(battery_present).publish_state(present);
      - component.update: battery_status_text  # ← danach status text
        
      ## temperature and humidity
      - component.update: outside_temp_humi
      ## light
      - component.update: lichtsensor
        
  - interval: 2500ms
    id: update_wind
    then:
      ## wind
      - component.update: wind_dir ## wind_dir and wind_dil update at the same time
      - component.update: wind_dil ## wind_dir and wind_dil update at the same time
      - delay: 400ms  ## 5avg x 20ms x 2 channels = min. 200ms
      - component.update: wind_direction_degrees
      - component.update: wind_speed


## --------- OUTPUT --------------
output:
  - platform: gpio
    id: divider_solar_enable_pin
    pin: 
      number: GPIO22
      inverted: false
  - platform: gpio
    id: divider_battery_enable_pin
    pin:
      number: GPIO23
      inverted: false
  
## --------- SWITCH SECTION --------------
switch:
  ## To avoid power leakages due to electronic
  ## DO NOT CHANGE
  - platform: output
    id: divider_solar_enable
    name: "solar on"
    output: divider_solar_enable_pin
    internal: true   ## NOT USED IN HA, JUST INTERNAL SWITCH FOR POWER SAVING
    restore_mode: ALWAYS_OFF

    ## To avoid power leakages due to electronic
    ## DO NOT CHANGE
  - platform: output
    id: divider_battery_enable
    name: "battery on"
    internal: true   ## NOT USED IN HA, JUST INTERNAL SWITCH FOR POWER SAVING
    output: divider_battery_enable_pin
    restore_mode: ALWAYS_OFF

## ESP32 uses 80mA when active and in wifi and only 3mA during deep sleep
## stay awake could be used to prevent deep sleep
  - platform: template
    name: "Stay awake"
    id: disable_sleep_switch
    optimistic: true
    
    turn_on_action:
      - logger.log: "Deep sleep disabled via switch"
      - deep_sleep.prevent: during_day
    turn_off_action:
      - logger.log: "Deep sleep enabled via switch"
      - deep_sleep.allow: during_day

## --------- SENSOR SECTION --------------
sensor:
## SUB: ----- WIND DIRECTION ------
## North is 0 or 360 degrees -> East 90 -> South 180 -> West 270
  - platform: adc
    pin: GPIO2
    id: wind_dir
    internal: true
    #raw: true
    #name: "Wind Direction X" ## Uncomment, if you would like to see the values in Home Assistant
    attenuation: 11dB ## Adjust attenuation according to your ESP32 specs
    update_interval: never   ## ATTENTION: DO NOT CHANGE: Must be updated by interval together with wind_dil
    samples: 5
    sampling_mode: avg  ## avg, min, max
    #filters:
    #  - sliding_window_moving_average:
    #      window_size: 5
    #      send_every: 5

  - platform: adc
    pin: GPIO3
    id: wind_dil
   # raw: true
    internal: true
    #name: "Wind Direction Y" ## Uncomment, if you would like to see the values in Home Assistant
    attenuation: 11dB
    update_interval: never   ## ATTENTION: DO NOT CHANGE: Must be updated by interval together with wind_dir
    samples: 5
    sampling_mode: avg  ## avg, min, max
    #filters:
    #  - sliding_window_moving_average:
    #      window_size: 5
    #      send_every: 5

  ## Calculating the direction from the two sensor values above.
  - platform: template
    name: "Wind.Degrees"
    icon: 'mdi:compass'
    id: wind_direction_degrees
    unit_of_measurement: "°"
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      // Get the voltages (not raw values) from both sensors
      float x_v = id(wind_dil).state;// - 2048.0; // Center the ADC readings around 0 by subtracting the midpoint (e.g., 1.65V or raw value ~2048) // Assuming raw 12-bit ADC values (0 - 4095)
      float y_v = id(wind_dir).state;// - 2048.0;

      // ---- Calibration per sensor (measured) ----
      const float X_MIN = 1.30f;
      const float X_MAX = 2.05f;
      const float Y_MIN = 1.30f;
      const float Y_MAX = 2.05f;
      // --------------------------------------------------------------

      float x_mid = (X_MIN + X_MAX) / 2.0f;
      float x_amp = (X_MAX - X_MIN) / 2.0f;
      float y_mid = (Y_MIN + Y_MAX) / 2.0f;
      float y_amp = (Y_MAX - Y_MIN) / 2.0f;

      float x = (x_v - x_mid) / x_amp;   // now values are between -1 and +1
      float y = (y_v - y_mid) / y_amp;

      // Prevent division by zero
      if (x == 0.0 && y == 0.0) return 0.0;
      
      // Calculate angle in radians
      float angle_rad = atan2(y, x);
      
      // Convert to degrees
      float angle_deg = angle_rad * 180.0 / M_PI;
      
      // Normalize to 0-360 degrees
      if (angle_deg < 0) {
        angle_deg += 360.0;
      }
      
      // mechanical offset
      const float MOUNT_OFFSET = 183.0f;  // 180 switch North/South + 3 Degrees PCB mount
      angle_deg += MOUNT_OFFSET;
      if (angle_deg >= 360.0f) angle_deg -= 360.0f;
      if (angle_deg < 0.0f) angle_deg += 360.0f;

      float new_angle = angle_deg;  // berechneter Winkel

      // Zirkuläre Differenz zum letzten Wert
      float last = id(wind_direction_degrees).state;
      if (isnan(last)) return new_angle;

      float diff = fabs(new_angle - last);
      if (diff > 180.0f) diff = 360.0f - diff;

      // skip edge over > 90° 
      const float skip_angle = 90.0f; 
      if (diff > skip_angle) {
        return last;   // keep previous value
      }
      return new_angle;
      
      //return angle_deg;
  
    on_value:
      then:
      - text_sensor.template.publish:
          id: wind_direction_text
          state: !lambda |-
            const char* directions[] = {
              "N", "NNE", "NE", "ENE",
              "E", "ESE", "SE", "SSE",
              "S", "SSW", "SW", "WSW",
              "W", "WNW", "NW", "NNW"
            };
      
            float angle_deg = id(wind_direction_degrees).state;
      
            // NAN-Absicherung, falls der ADC-Sensor noch keinen gültigen Wert hat
            if (isnan(angle_deg)) return {};
      
            int index = ((int) round(angle_deg / 22.5)) % 16;
            if (index < 0) index += 16;
      
            return std::string(directions[index]);
            
  ## SUB: ----- WIND SPEED -----
  - platform: template
    unit_of_measurement: 'm/s' 
    name: 'Wind.Speed'
    icon: 'mdi:weather-windy'
    id: wind_speed
    accuracy_decimals: 2 
    update_interval: 5s
    lambda: |-
      int count = id(pulse_count);
      id(pulse_count) = 0;
      float rotations_per_sec = count / 2.0f / 5.0f;   // update_interval = 5s // 2 pulses per turn
      float circ_m = 0.09f * 2.0f * 3.14159f;
      
      return 1.18f * circ_m * rotations_per_sec;

## ------ LIGHT SENSOR ---------
  - platform: tsl2591
    name: "Licht.Lichtsensor"
    id: lichtsensor
    address: 0x29   ## or 0x28
    update_interval: 60s
    gain: auto
    device_factor: 53
    glass_attenuation_factor: 14.4
    visible:
      name: "Licht.sichtbares"
    infrared:
      name: "Licht.IR"
    full_spectrum:
      name: "Licht.FullSpectrum"
    calculated_lux:
      id: i_lux
      name: "Licht.Lux"
    actual_gain:
      id: actual_gain
      name: "Licht.gain"

## 1. Tag/Nacht- und Dämmerungserkennung
## Der TSL2591 hat einen sehr großen Dynamikbereich (von unter 1 Lux bis >80.000 Lux bei entsprechender Gain/Integration-Zeit-Einstellung). Damit lässt sich zuverlässig zwischen Nacht, Dämmerung, bewölktem Tag und praller Sonne unterscheiden – deutlich feiner als ein simpler Dämmerungsschalter. In Home Assistant per binary_sensor mit Lux-Schwellwert (z. B. < 10 Lux = "dunkel") für automatisches Licht-An/Aus, oder mit mehreren Schwellwerten für abgestufte Szenen (Dämmerlicht, Nachtlicht etc.).
## 2. Lichtsteuerung / Daylight Harvesting
## Innenbeleuchtung nur dann automatisch zuschalten, wenn natürliches Licht unter einen Zielwert fällt – klassisches "Daylight Harvesting". Reduziert unnötiges Lampenlaufen bei ausreichend Tageslicht.
## 3. Wolken-/Trübungsindex über das Verhältnis IR zu Full Spectrum
## Das Verhältnis von IR-Kanal zu Full-Spectrum-Kanal ändert sich mit dem Bewölkungsgrad, weil diffuses Licht (bedeckter Himmel) einen anderen Spektralanteil hat als direkte Sonne. Daraus lässt sich ein grober "Cloudiness-Index" als Template-Sensor in HA bauen – z. B. um bei aufziehender Bewölkung Markisen/Rollläden anders zu steuern als bei klarem Himmel.
## 4. Sturm-/Wetteränderungswarnung über die Änderungsrate
## Ein plötzlicher, untypischer Lux-Abfall tagsüber (nicht durch normale Dämmerung erklärbar, z. B. über einen derivative- oder trend-Sensor in HA) kann auf aufziehendes Unwetter hindeuten → Automation "Fenster/Markise schließen bei rapide fallendem Lichtwert".
## 5. Beschattungs-/Hitzeschutzautomation
## Bei hohen Lux-Werten in Kombination mit Sonnenstand (HA-sun-Integration liefert Azimut/Elevation) gezielt Rollläden oder Markisen an bestimmten Fenstern steuern, wenn direkte Sonne auf sie trifft – klassischer Blend-/Hitzeschutz, besser als reine Zeit- oder Temperatursteuerung.
## 6. Verschmutzungs-/Wartungserkennung
## Wenn der Sensor hinter Glas oder in einem Gehäuse mit Schutzscheibe sitzt: eine langsame, kontinuierliche Abnahme der maximalen Tages-Lux-Werte über Wochen (z. B. via HA-Statistik/Langzeit-Trend) kann auf Verstaubung/Verschmutzung der Scheibe hindeuten – Erinnerung zum Reinigen.
## 7. Bewässerungssteuerung (Garten/Balkon)
## Tägliche Lichtintegration (Summe/Mittelwert über den Tag als Proxy für Sonneneinstrahlung) kann in Bewässerungs-Automationen einfließen – an sonnigen Tagen mehr gießen, an bedeckten weniger, ähnlich wie es "smarte" Bewässerungscomputer mit Wetterdaten machen, nur lokal gemessen statt aus einer Wetter-API.
## 8. Korrelation mit PV-Ertrag
## Falls du eine PV-Anlage hast: Lux-Werte grob mit dem tatsächlichen Ertrag vergleichen, um Verschattung oder Modulverschmutzung zu erkennen, wenn der gemessene Lichtwert hoch ist, der Ertrag aber unerwartet niedrig.
## In ESPHome würdest du dafür einfach mehrere sensor:-Einträge (full_spectrum, infrared, visible, lux) definieren und zusätzlich Template-Sensoren für abgeleitete Werte (z. B. IR/Full-Spectrum-Verhältnis) per lambda, die du dann in Home Assistant für die jeweiligen Automationen nutzt.

## SUB: ----- TEMPERATURE | HUMIDITY  ------
## SHTC3
  - platform: shtcx
    # address: 0x70  ## (Optional, int) Manually specify the I²C address of the sensor. Defaults to 0x70.
    # update_interval: 60 ## (Optional, Time) The interval to check the sensor. Defaults to 60s.
    id: outside_temp_humi
    temperature:
      name: "Outside.Temperature"
    humidity:
      name: "Outside.Humidity"

## SUB: ----- RAIN GAUGE -----
## A = pi * r^2 = pi * 115mm/2 ~ 10.387 mm^2 = 103,9 cm^2
## volume of seesaw = 2.5ml
## mm_per_pulse (2.5ml * 1000) / A = (2.5ml * 1000) / 10.387 mm^2 = 2.5 ml * 0.0963 = 0.24075 mm
  - platform: pulse_counter
    pin:
      number: GPIO10
      inverted: true
      mode:
        input: true
        pullup: true ## internal pullup 45kOhm is to much. External 4.7KOhm is being used.
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    unit_of_measurement: 'mm/h'
    device_class: precipitation_intensity
    state_class: measurement
    name: 'Rain.Rate'
    ## mm/h = pulse_per_minute * 2.5ml * 60
    icon: "mdi:speedometer"
    id: rain_gauge
    #update_interval: 1min
    filters:
      - multiply: 12 # mm_per_alternating (0.2mm ) * 60
    total:
      unit_of_measurement: 'ml'
      device_class: precipitation
      state_class: total
      name: 'Rain.Total'
      icon: "mdi:weather-pouring"
      filters:
        - multiply: 0.241
  


 ## SUB: ----- BATTERY VOLTAGE ------
 ## maximum 4.5V, nominal. 4.2V with 3 AA NiMH rechargeables, voltage divider 120k and 68k
  - platform: adc
    pin: GPIO4
    name: "Battery.Voltage"
    id: battery_voltage_raw
    icon: "mdi:battery-arrow-up-outline"
    update_interval: never   ## will be updated by interval 30s
    attenuation: 11db
    accuracy_decimals: 2
    raw: false
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    #samples: 5

    on_raw_value:
      then:
        - logger.log:
            format: "Battery ADC Rohwert: %.4f V"
            args: ['x']
            level: DEBUG

    on_value:
      then:
        - switch.turn_off: divider_battery_enable  ## important to unpower measurement electronics that have leakages
        - logger.log:
            format: "Battery Spannung (berechnet): %.3f V"
            args: ['x']
            level: INFO
        
        ## Kein Akku → Warnung
        - if:
            condition:
              lambda: 'return id(battery_voltage_raw).state == 0.0f;'
            then:
              - logger.log:
                  format: "⚠️ Keine Akkus eingelegt – CN3085 Leerlauf!"
                  level: WARN
        ## Batterien (nicht wiederaufladbar) erkannt
        ## untested yet
     #   - if:
     #       condition:
     #         lambda: |-
     #           float v = id(battery_voltage_raw).state;
      #          return (v > 1.55f * 3 && v < 4.35f);  // >4,65V wäre Alkaline voll
      #      then:
      #        - logger.log:
      #            format: "⚠️ Achtung: Möglicherweise nicht-wiederaufladbare Batterien!"
      #            level: WARN
#    filters:
#      - lambda: |-
#          // raw: true → x ist 0–4095
#          const float vce_sat = 0.30;
#          const float r1 = 56000.0;
#          const float r2 = 100000.0;
#          const float adc_max = 4095.0;
#          const float adc_ref = 3.1f;    // 11dB Eingangsbereich ESP32-C6
#          float v_adc = (x / adc_max) * adc_ref;
#          if (v_adc < vce_sat) return 0.0;
#          return (v_adc - vce_sat) * (r1 + r2) / r2 + vce_sat;
    filters:
      - calibrate_linear: 
           method: least_squares
           datapoints:
             - 0.0   -> 0.0       # Nullpunkt
             -  2.493 -> 2.652    # Rohwert → korrigierter Rohwert
          
         
      - lambda: |-
          const float vce_sat = 0.30f;   // V, Sättigungsspannung EMD22
          const float r1 = 56000.0;     // Ohm  R11
          const float r2 = 100000.0;    // Ohm  R12
          const float V_NO_BAT_LOW  = 4.34f;  // CN3085 Leerlauf beginnt hier
          const float V_NO_BAT_HIGH = 4.45f;  // CN3085 Leerlauf endet hier
          
          //const float cal = 1.0638;      // ADC correction
          //float x_cal = x * cal;
          if (x < vce_sat) return 0.0f;

          // Eingangsspannung berechnen
          float v_in = (x - vce_sat) * (r1 + r2) / r2 + vce_sat;

          // Leerlauf-Erkennung:
          // - Nur wenn NICHT geladen wird
          // - UND Spannung im Leerlauf-Bereich
          if (v_in >= V_NO_BAT_LOW && v_in <= V_NO_BAT_HIGH) {
            if (id(charge_detection).state) {
              // Laden aktiv → echte Spannung zurückgeben, kein Leerlauf
              return v_in;
            } else {
              // Kein Laden → CN3085 Leerlauf → kein Akku
              return 0.0f;
            }
          }

          return v_in;
          //return (x - vce_sat) * (r1 + r2) / r2 + vce_sat;
      
## SUB: ----- SOLAR PANEL VOLTAGE ------
## maximum @8V with full sunlight, voltage divider 56k and 100k
## maximum @6V with full sunlight, voltage divider 120k and 100k
  - platform: adc
    pin: GPIO5
    name: "Solarpanel.Voltage"
    id: solar_voltage_raw
    icon: "mdi:solar-power-variant-outline"
    update_interval: never   ## will be updated by interval 30s
    attenuation: 11db
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    #samples: 5

    on_raw_value:
      then:
        - logger.log:
            format: "Solar ADC Rohwert: %.4f V"
            args: ['x']
            level: DEBUG

    on_value:
      then:
        - switch.turn_off: divider_solar_enable   ## important to unpower measurement electronics that have leakages
        - logger.log:
            format: "Solar Spannung (berechnet): %.3f V"
            args: ['x']
            level: INFO
    
    filters:
      - calibrate_linear: 
           method: least_squares
           datapoints:
             - 0.0   -> 0.0       ## Nullpunkt
             - 1.277 -> 1.277     ## Punkt 2: 3,00V real (Rohwert stimmt hier)
             - 1.462 -> 1.665     ## Punkt 1: 4,07V real
             - 2.000 -> 2.000     ## 6,00V
             
    ## ADC-Rohwert (0-3.0V) zurück auf echte Solarspannung umrechnen
    ## V_in = (V_adc - VCE) * (R1+R2)/R2 + VCE
      - lambda: |-
          const float vce_sat = 0.30;   // V, Sättigungsspannung EMD22
          const float r1 = 120000.0;    // Ohm  R13
          const float r2 = 68000.0;     // Ohm  R14
          //const float cal = 1.1388;      // ADC-correction
          //float x_cal = x * cal;
          if (x < vce_sat) return 0.0;  // Schutz gegen negative Werte
          return (x - vce_sat) * (r1 + r2) / r2 + vce_sat;

