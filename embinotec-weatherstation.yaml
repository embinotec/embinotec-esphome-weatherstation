   ## -------- Battery status ----- 
  - platform: template
    name: "Battery.status"
    id: battery_status_text
    icon: "mdi:battery"
    update_interval: never   ## will be updated by binary_sensor
    lambda: |-
      float v = id(battery_voltage_raw).state;
      bool present = id(battery_present_state);
      const float BAT_FULL = 80.0f;
      const float BAT_WEAK = 20.0f;
      
      if (isnan(v) || !present) return {"⚠️ Kein Akku eingelegt"};

      // Alkaline Batterien erkennen:
      // Frische AA Alkaline = 1,5V × 3 = 4,5V
      // NiMH voll           = 1,45V × 3 = 4,35V
      // → Über 4,36V mit Akku eingelegt = wahrscheinlich Alkaline
      if (v > 4.36f) return {"🔴 Achtung: Batterien statt Akkus!"};

      // NiMH Ladestand (3,6V leer – 4,35V voll)
      float pct = (v - 3.6f) / (4.35f - 3.6f) * 100.0f;
      if (pct < 0.0f)   pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;

      char buf[48];
      if (id(charge_detection).state) {
        snprintf(buf, sizeof(buf), "⚡ Lädt "); //– %.0f%% (%.2fV)", pct, v);
      } else if (pct >= BAT_FULL) {
        snprintf(buf, sizeof(buf), "🔋 Voll – %.0f%% (%.2fV)", pct, v);
      } else if (pct >= BAT_WEAK) {
        snprintf(buf, sizeof(buf), "🔋 OK – %.0f%% (%.2fV)", pct, v);
      } else {
        snprintf(buf, sizeof(buf), "🪫 Schwach – %.0f%% (%.2fV)", pct, v);
      }
      return {buf};
      
  ## barometric pressure change per hour in hPa
## ------ Barometric Pressure ------------
#+1–2 hPa/h	Wetter bessert sich langsam
#+2–6 hPa/h	Wetterbesserung, Wind nimmt ab
#>6 hPa/h	Schnelle Wetterbesserung, aber danach oft wieder wechselhaft
#–1–2 hPa/h	Wetter verschlechtert sich langsam
#–2–6 hPa/h	Regen und Wind in 12–24h wahrscheinlich
#<–6 hPa/h	Sturm möglich, sehr schnelle Verschlechterung
#Stabil ±0,5 hPa	Wetter bleibt konstant

#>1020 hPa	stabil	Sonnig, trocken – ideale Bedingungen für Solarladung ☀️
#>1020 hPa	fallend	Wetteränderung kommt, noch 12–24h gut
#1000–1020 hPa	steigend	Besserung im Anzug
#1000–1020 hPa	fallend	Regen wahrscheinlich
#<1000 hPa	fallend	Schlechtwetter, Sturm möglich
#<1000 hPa	steigend	Ende des Schlechtwetters
    
  - platform: template
    name: "Baro.Druckänderung pro Stunde"
    id: pressure_trend_per_hour
    icon: "mdi:gauge"
    update_interval: never   # wird durch on_value des BMP581 gesteuert
    lambda: |-
      if (!id(pressure_buffer_full)) {
        return {"Wird ermittelt..."};
      }
      float delta = id(air_pressure).state - id(pressure_1h_ago);
      char buf[32];
      snprintf(buf, sizeof(buf), "%+.1f hPa/h", delta);
      return {buf};
  ## barometric weather trend
  - platform: template
    name: "Baro.Wettertrend"
    id: pressure_trend_text
    icon: "mdi:weather-partly-cloudy"
    update_interval: never
    lambda: |-
      if (!id(pressure_buffer_full)) {
        return {"Wird ermittelt..."};
      }

      float delta = id(air_pressure).state - id(pressure_1h_ago);
      float p     = id(air_pressure).state;

      // --- Sturm-Warnung hat höchste Priorität ---
      if (delta < -6.0f)
        return {"⛈ Sturmwarnung – sehr schneller Druckabfall!"};

      if (delta > 6.0f)
        return {"🌬 Schnelle Besserung – danach oft wechselhaft"};

      // --- Hoher Druck ---
      if (p > 1020.0f) {
        if (delta > 2.0f)  return {"☀️ Stabil schön – Hochdrucklage"};
        if (delta > 0.5f)  return {"🌤 Schön, leichte Besserung"};
        if (delta > -0.5f) return {"☀️ Sonnig und stabil"};
        if (delta > -2.0f) return {"🌤 Noch schön, Änderung kommt"};
        return {"⛅ Wetteränderung in 12–24h möglich"};
      }

      // --- Mittlerer Druck ---
      if (p >= 1000.0f) {
        if (delta > 2.0f)  return {"🌤 Besserung im Anzug"};
        if (delta > 0.5f)  return {"⛅ Leichte Besserung"};
        if (delta > -0.5f) return {"⛅ Wechselhaft, stabil"};
        if (delta > -2.0f) return {"🌧 Regen wahrscheinlich"};
        return {"🌧 Schlechtwetter nähert sich"};
      }

      // --- Tiefer Druck ---
      if (delta > 2.0f)  return {"🌦 Besserung beginnt"};
      if (delta > 0.5f)  return {"🌧 Noch Regen, Besserung kommt"};
      if (delta > -0.5f) return {"🌧 Tiefdrucklage, anhaltend"};
      return {"⛈ Schlechtwetter – Sturm möglich"};
