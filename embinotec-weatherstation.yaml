## ------ LOGGING ------
## Options: NONE, ERROR, WARN, INFO, DEBUG, VERBOSE, VERY_VERBOSE
logger:
  level: DEBUG
  logs:
    sensor: DEBUG
 #   lvgl: info

## ------ HOME ASSISTANT API ------
## To generate a new based64 32 byte code, go to https://generate-random.org/base64-string.
## Set byte-count to 32 and hit GENERATE. Copy it to your key in quotes.
api:
  encryption:
    key: !secret encryption_key

## ------ OVER THE AIR UPDATE ------
## To be able to do updates over the Air by ESP Home it is nessesary to have this option activated.
ota:
  - platform: esphome
    password: !secret ota_password

## ------- WIFI SETTINGS -------
## You could either use Wifi or Thread below
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: embinotec-weatherstation.local ## when 
  power_save_mode: HIGH    ## OPTIONS: NONE (least power saving), LIGHT (Default), HIGH (most power saving)
  ## 80mA NONE | 72mA LIGHT | 60mA HIGH
  fast_connect:  ## Optional: speeds up connection
    enabled: true
    storage: rtc
## Optional manual IP
#  manual_ip:
#    static_ip: 192.168.0.137
#    gateway: 192.168.0.1
#    subnet: 255.255.255.0
  ## Enable fallback hotspot (captive portal) in case wifi connection fails
  ## SECTION: CAPTIVE PORTAL must be active
  ap:
    ssid: "embinotec-Weatherstation"
    password: !secret fallback_pw
    ap_timeout: 1min # Change time here

## SUB:------- CAPTIVE PORTAL SETTINGS --------
## Works together with SUBSECTION wifi.ap
captive_portal:

## SUB:------- mDNS SETTINGS -------
## mDNS is a computer networking protocol that resolves hostnames to IP addresses within small networks that do not include a local name server.
## example: embinotec-weatherstation.local
mdns:
  disabled: false # Set to true to disable mDNS

## SUB:------ WEB SERVER SETTINGS -------
## If webserver is activeted your weatherstation will be reachable in your browsers address bar http://<use_address>
web_server:
  port: 80

## SUB:------ WEB SERIAL --------
## Improve serial is a standard to connect by webserial and cable
improv_serial:
  #next_url: http://example.com/?device_name={{device_name}}&ip_address={{ip_address}}&esphome_version={{esphome_version}}

## SUB:------ ESP32 Improve ------
## solid: The improv service is active and waiting to be authorized.
## blinking once per second: The improv service is awaiting credentials.
## blinking 3 times per second with a break in between: The identify command has been used by the client.
## blinking 5 times per second: Credentials are being verified and saved to the device.
## off: The improv service is not running.
esp32_improv:
  authorizer: user_button
  
