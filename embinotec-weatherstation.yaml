## SUB: ----- barometric pressure ----
  - platform: bmp581_i2c
    address: 0x47          ## alternativ 0x46 
    update_interval: 60s

    ## redundancy to outside.temp
#    temperature:
#      name: "Baro.Temperatur (Barometer)"
#      id: baro_temperature
#      unit_of_measurement: "°C"
#      accuracy_decimals: 1
#      device_class: temperature
#      state_class: measurement
#      oversampling: NONE

    pressure:
      name: "Baro.Luftdruck"
      id: air_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 1
      device_class: atmospheric_pressure
      state_class: measurement
      oversampling: 16x
      #iir_filter: OFF      # ESPHome-Filter wird unten verwendet

      on_value:
        then:
          # Druckänderung pro Stunde berechnen (alle 60s ein Wert)
          # Nach 60 Messungen (= 60 min) ist der Puffer voll
          - lambda: |-
              static float ring_buffer[60] = {0};
              static int index = 0;
              static int count = 0;

              ring_buffer[index] = x;
              index = (index + 1) % 60;
              if (count < 60) count++;

              if (count >= 60) {
                // ältester Wert = aktueller Index (wurde gerade überschrieben)
                id(pressure_1h_ago) = ring_buffer[index];
                id(pressure_buffer_full) = true;
              } else {
                id(pressure_buffer_full) = false;
              }

          # text_sensor aktualisieren
          - component.update: pressure_trend_per_hour
          - component.update: pressure_trend_text

      filters:
        # Exponentieller Glättungsfilter (ersetzt IIR im Sensor)
        - exponential_moving_average:
            alpha: 0.1
            send_every: 1


